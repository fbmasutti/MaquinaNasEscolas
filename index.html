<title>Da Alavanca ao Código — Coletivo Máquina Tudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body { margin: 0; background: #F7F4EE; color: #16130F; font-family: 'Space Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #0E7C97; text-decoration: none; }
  a:hover { color: #FF38CB; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #00BCE0; outline-offset: 3px; }
  ::selection { background: #FF9B22; color: #16130F; }
  img { display: block; max-width: 100%; }
  input, textarea, button { font: inherit; color: inherit; }
  p { text-wrap: pretty; }

  #bncc-modulos { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
  #coletivo-galeria { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
  @media (max-width: 1050px) {
    #bncc-modulos { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
    #coletivo-galeria { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
  }
  @media (max-width: 640px) {
    #bncc-modulos { grid-template-columns: 1fr !important; }
    #coletivo-galeria { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  }
  @media (max-width: 640px) {
    .cron-row { grid-template-columns: 1fr !important; gap: 4px !important; }
    .cron-row > *:first-child { font-size: 1rem !important; }
    .cron-online { margin-left: 0 !important; }
    .nav-links { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap !important; justify-content: flex-start !important; padding-bottom: 2px; }
    .nav-links::-webkit-scrollbar { display: none; }
  }
</style>
</helmet>
